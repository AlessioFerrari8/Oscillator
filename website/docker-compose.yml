services:
  oscilla:
    build:
      context: .
    image: oscilla:latest
    container_name: oscilla
    restart: unless-stopped
    ports:
      # Same port as `ng serve`, so the container and the dev server are reachable
      # at the same address
      - "4200:8080"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
