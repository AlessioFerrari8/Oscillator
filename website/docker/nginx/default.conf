server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The initial bundle is 257 kB raw against ~70 kB over the wire: compression
    # is worth more than everything else combined on a page opened 50 times a day.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # index.html and boot.js do NOT carry a hash in their name. Caching them for
    # long means that after a deploy the browser keeps asking for the old chunks.
    location = /index.html {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /boot.js {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Every other JS/CSS file carries the hash (outputHashing: all), so the name
    # changes on every build: they are immutable by definition.
    location ~* \.(?:js|css)$ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Self-hosted fonts and the favicon have no hash but hardly ever change.
    location ~* \.(?:woff2?|ico|png|svg)$ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    location / {
        include /etc/nginx/snippets/security.conf;
        # SPA: any unknown path falls back to index.html which, being an
        # internal redirect, re-enters the location = /index.html above and
        # picks up its no-cache.
        try_files $uri $uri/ /index.html;
    }
}
