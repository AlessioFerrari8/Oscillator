# Security headers shared by every location.
#
# NO Content-Security-Policy here, for now: `index.html` does not carry one
# either. Adding one is worth doing, but it has to be written against what the
# app really calls (the weather widget talks to open-meteo, the scope draws on a
# canvas), otherwise the first deploy silently breaks the forecast.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;

# geolocation is genuinely used (services/geo.ts): leave it at 'self' and only
# switch off what the app never touches.
add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
